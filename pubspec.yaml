name: zolanime
description: "An simple anime app for watching anime made by Zolenf"
publish_to: "none"
version: 2.1.0+0

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  google_fonts: ^8.1.0
  http: ^1.6.0
  media_kit: ^1.2.6
  media_kit_libs_video: ^1.0.7
  media_kit_video: ^2.0.1
  shared_preferences: ^2.2.2
  flutter_web_auth_2: ^5.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  msix: ^3.16.13

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: true
  image_path: "assets/icon.png"
  adaptive_icon_background: "#1A1A1A"
  adaptive_icon_foreground: "assets/icon.png"
  monochrome_icon: "assets/icon.png"
  windows:
    generate: true
    image_path: "assets/icon.png"

msix_config:
  display_name: ZolAnime
  publisher_display_name: Zolenf
  identity_name: zolanime.app
  logo_path: assets/icon.png
